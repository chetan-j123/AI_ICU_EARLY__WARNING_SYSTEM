services:
  - type: web
    name: icu-early-warning-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_BRIDGE_TIMEOUT_MS
        value: "120000"
